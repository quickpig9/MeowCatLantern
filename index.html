<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeowCatLantern - Projects</title>
    <!-- Icon in browser tab -->
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/quickpig9/MeowCatLantern/refs/heads/main/Ikon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
            padding: 1.5rem 2rem;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: #f43f5e;
            text-decoration: none;
        }

        .cat-icon {
            width: 48px;
            height: auto;
            border-radius: 4px;
            image-rendering: pixelated;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 2rem;
            flex: 1;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 1.5rem;
            text-align: center;
            color: #f8fafc;
        }

        h1 span {
            color: #f43f5e;
        }

        .controls-bar {
            margin-bottom: 1.5rem;
        }

        .search-bar {
            width: 100%;
            padding: 0.75rem 1.25rem;
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 0.375rem;
            color: #f8fafc;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .search-bar:focus {
            border-color: #f43f5e;
            box-shadow: 0 0 0 3px rgba(244, 63, 94, 0.15);
        }

        .projects-container {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .project-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            padding: 1rem 1.5rem;
            border-radius: 0.5rem;
            transition: border-color 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .project-card:hover {
            border-color: #f43f5e;
        }

        .card-content {
            display: flex;
            align-items: center;
            gap: 2rem;
            flex: 1;
        }

        .project-card h3 {
            color: #f43f5e;
            font-size: 1.1rem;
            min-width: 220px;
            margin-bottom: 0;
        }

        .project-card p {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 0;
        }

        .btn {
            display: inline-block;
            background-color: #f43f5e;
            color: #ffffff;
            padding: 0.45rem 1rem;
            border-radius: 0.375rem;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            text-align: center;
            transition: background-color 0.2s ease;
            white-space: nowrap;
        }

        .btn:hover {
            background-color: #e11d48;
        }

        footer {
            background-color: #1e293b;
            border-top: 1px solid #334155;
            text-align: center;
            padding: 1.5rem;
            margin-top: 4rem;
            color: #64748b;
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
        }

        .footer-icon {
            width: 24px;
            height: auto;
            opacity: 0.5;
            image-rendering: pixelated;
        }
    </style>
</head>
<body>

    <header>
        <img src="Ikon.png" alt="MeowCatLantern Icon" class="cat-icon">
        <a href="#" class="logo">MeowCatLantern</a>
    </header>

    <main class="container">
        <h1>List of <span>Projects</span></h1>

        <div class="controls-bar">
            <input type="text" id="searchInput" class="search-bar" placeholder="Find a repository..." onkeyup="filterProjects()">
        </div>

        <div class="projects-container" id="projectsContainer">
            
            <div class="project-card" data-name="template">
                <div class="card-content">
                    <h3>template</h3>
                    <p>A template for new projects.</p>
                </div>
                <a href="#" class="btn" target="_blank">Open</a>
            </div>

        </div>
    </main>

    <footer>
        <img src="Ikon.png" alt="MeowCatLantern Footer Icon" class="footer-icon">
        <p>MeowCatLantern Projects</p>
    </footer>

    <script>
        function filterProjects() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('project-card');

            for (let i = 0; i < cards.length; i++) {
                let text = cards[i].innerText.toLowerCase();
                if (text.includes(input)) {
                    cards[i].style.display = "";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }
    </script>

</body>
</html>
